<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bens - BankSecure</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-page">
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/Santander.png" alt="Logo" class="sidebar-logo">
                <h1 class="logo-compact">BankSecure</h1>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="clientes.html" class="nav-item">
                    <span class="icon">👥</span>
                    <span>Clientes</span>
                </a>
                <a href="seguros.html" class="nav-item">
                    <span class="icon">🛡️</span>
                    <span>Seguros</span>
                </a>
                <a href="cotacao.html" class="nav-item">
                    <span class="icon">💰</span>
                    <span>Cotação</span>
                </a>
                <a href="apolices.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span>Apólices</span>
                </a>
                <a href="bens.html" class="nav-item active">
                    <span class="icon">🏠</span>
                    <span>Bens</span>
                </a>
                <hr>
                <button id="logout-btn" class="nav-item logout">
                    <span class="icon">🚪</span>
                    <span>Sair</span>
                </button>
            </nav>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <div class="user-info" id="user-info"></div>
                <h2>Bens</h2>
                <div class="topbar-actions">
                    <button id="btn-novo-bem" class="btn btn-primary btn-sm">+ Novo Bem</button>
                </div>
                <button class="hamburger-menu" id="hamburger-btn">☰</button>
            </header>

            <main class="content">
                <div id="modal-bem" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Novo Bem</h2>
                            <button class="modal-close">&times;</button>
                        </div>
                        <form id="form-bem">
                            <div class="form-group">
                                <label>Cliente</label>
                                <select name="clienteId" required>
                                    <option value="">Carregando clientes...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <select name="tipo" required>
                                    <option value="">Selecione um tipo</option>
                                    <option value="AUTO">Auto/Carro</option>
                                    <option value="RESIDENCIAL">Residencial/Casa</option>
                                    <option value="VIDA">Vida/Pessoa</option>
                                    <option value="CELULAR">Celular/Eletrônico</option>
                                    <option value="MOTO">Moto/Motocicleta</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Descrição (opcional)</label>
                                <textarea name="descricao" rows="4" placeholder="Ex: Toyota Corolla 2020, branco"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Registrar Bem</button>
                        </form>
                        <div id="msg-bem" class="status-message"></div>
                    </div>
                </div>

                <div id="modal-editar-bem" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Editar Bem</h2>
                            <button class="modal-close">&times;</button>
                        </div>
                        <form id="form-editar-bem">
                            <input type="hidden" id="bem-id-edit" name="id">
                            <div class="form-group">
                                <label>Cliente</label>
                                <input type="text" id="cliente-nome-edit" name="cliente" disabled>
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <select id="tipo-edit" name="tipo" required>
                                    <option value="AUTO">Auto/Carro</option>
                                    <option value="RESIDENCIAL">Residencial/Casa</option>
                                    <option value="VIDA">Vida/Pessoa</option>
                                    <option value="CELULAR">Celular/Eletrônico</option>
                                    <option value="MOTO">Moto/Motocicleta</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Descrição</label>
                                <textarea id="descricao-edit" name="descricao" rows="4" placeholder="Ex: Toyota Corolla 2020, branco"></textarea>
                            </div>
                            <div class="form-buttons">
                                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                            </div>
                        </form>
                        <div id="msg-editar-bem" class="status-message"></div>
                    </div>
                </div>

                <div id="cliente-filter" class="form-container" style="display: none;">
                    <label>Filtrar por Cliente:</label>
                    <select id="select-cliente-filter" style="width: 100%; max-width: 300px; padding: 8px; margin-top: 10px;">
                        <option value="">Todos os clientes</option>
                    </select>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="bens-list">
                            <tr>
                                <td colspan="5" class="empty-state">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import {
            requireAuth,
            logout,
            listarClientes,
            listarBens,
            cadastrarBem,
            atualizarBem
        } from './js/api.js';
        import { inicializarMenuHamburger } from './js/menu.js';

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const funcionario = requireAuth();
                document.querySelector('#user-info').textContent = `${funcionario.nome} (${funcionario.cargo})`;

                // Event listener melhorado para o botão de logout
                document.querySelector('#logout-btn').addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Botão Sair clicado');
                    logout();
                });
                inicializarMenuHamburger();

        const modal = document.querySelector('#modal-bem');
        const btnNovoBem = document.querySelector('#btn-novo-bem');
        const modalClose = document.querySelector('.modal-close');
        const formBem = document.querySelector('#form-bem');
        const msgBem = document.querySelector('#msg-bem');
        const bensList = document.querySelector('#bens-list');
        const clienteFilter = document.querySelector('#cliente-filter');
        const selectClienteFilter = document.querySelector('#select-cliente-filter');

        let clientes = [];
        let bens = [];
        let filtroClienteId = null;

        // Mapa de placeholders por tipo de bem
        const placeholdersPorTipo = {
            'AUTO': 'Ex: Toyota Corolla 2020, branco, placa ABC-1234',
            'RESIDENCIAL': 'Ex: Casa na Av. Paulista, 1578 - São Paulo',
            'VIDA': 'Ex: João da Silva, CPF 123.456.789-00',
            'CELULAR': 'Ex: iPhone 13 Pro Max, IMEI 123456789012345',
            'MOTO': 'Ex: Honda CB 500F 2021, vermelha, placa XYZ-1234'
        };

        // Listener para mudar placeholder conforme tipo selecionado
        const tipoSelectCreate = formBem.querySelector('select[name="tipo"]');
        const descricaoCreate = formBem.querySelector('textarea[name="descricao"]');

        tipoSelectCreate.addEventListener('change', (e) => {
            const tipoSelecionado = e.target.value;
            if (tipoSelecionado && placeholdersPorTipo[tipoSelecionado]) {
                descricaoCreate.placeholder = placeholdersPorTipo[tipoSelecionado];
            } else {
                descricaoCreate.placeholder = 'Ex: Toyota Corolla 2020, branco';
            }
        });

        // Listener para mudar placeholder no formulário de edição

        // Abrir/fechar modal
        btnNovoBem.addEventListener('click', () => {
            formBem.reset();
            msgBem.textContent = '';
            modal.classList.add('open');
        });

        modalClose.addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('open');
        });

        // Carregar clientes
        async function carregarClientes() {
            try {
                clientes = await listarClientes();

                const clienteSelect = formBem.querySelector('select[name="clienteId"]');
                clienteSelect.innerHTML = '<option value="">Selecione um cliente</option>' +
                    clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

                selectClienteFilter.innerHTML = '<option value="">Todos os clientes</option>' +
                    clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');

                clienteFilter.style.display = 'block';
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
            }
        }

        // Filtrar por cliente
        selectClienteFilter.addEventListener('change', (e) => {
            filtroClienteId = e.target.value ? parseInt(e.target.value) : null;
            exibirBens();
        });

        // Cadastrar novo bem
        formBem.addEventListener('submit', async (e) => {
            e.preventDefault();
            const clienteId = formBem.querySelector('select[name="clienteId"]').value;
            const tipo = formBem.querySelector('select[name="tipo"]').value;
            const descricao = formBem.querySelector('textarea[name="descricao"]').value;

            if (!clienteId || !tipo) {
                msgBem.textContent = 'Selecione cliente e tipo';
                msgBem.className = 'status-message error';
                return;
            }

            try {
                msgBem.textContent = 'Registrando bem...';
                msgBem.className = 'status-message info';

                await cadastrarBem({
                    clienteId: parseInt(clienteId),
                    tipo: tipo,
                    descricao: descricao || null
                });

                msgBem.textContent = 'Bem registrado com sucesso!';
                msgBem.className = 'status-message success';

                setTimeout(() => {
                    modal.classList.remove('open');
                    carregarBens();
                }, 1500);
            } catch (error) {
                msgBem.textContent = error.message;
                msgBem.className = 'status-message error';
            }
        });

        // Carregar bens
        async function carregarBens() {
            try {
                // Garantir que clientes estejam carregados
                if (clientes.length === 0) {
                    await carregarClientes();
                }

                // Se houver filtro, buscar bens do cliente específico
                if (filtroClienteId) {
                    bens = await listarBens(filtroClienteId);
                } else {
                    // Buscar todos os bens (chamar sem parâmetro)
                    bens = await listarBens();
                }
                exibirBens();
            } catch (error) {
                console.error('Erro ao carregar bens:', error);
                bensList.innerHTML = '<tr><td colspan="5" class="empty-state"><p>Erro ao carregar bens</p></td></tr>';
            }
        }

        // Exibir bens na tabela
        function exibirBens() {
            let bensFiltrados = bens;

            if (filtroClienteId) {
                bensFiltrados = bens.filter(b => b.clienteId === filtroClienteId);
            }

            if (!bensFiltrados || bensFiltrados.length === 0) {
                bensList.innerHTML = '<tr><td colspan="5" class="empty-state"><p>Nenhum bem registrado</p></td></tr>';
                return;
            }

            bensList.innerHTML = bensFiltrados.map(b => {
                const clienteNome = clientes.find(c => c.id == b.clienteId)?.nome || '-';
                const tipo = b.tipo || '-';
                const descricao = b.descricao || '-';

                return `
                    <tr>
                        <td>${b.id}</td>
                        <td>${clienteNome}</td>
                        <td>${tipo}</td>
                        <td>${descricao}</td>
                        <td class="actions">
                            <button class="btn btn-icon btn-edit" onclick="editarBem(${b.id})" title="Editar">✏️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Editar bem
        window.editarBem = (bemId) => {
            const bem = bens.find(b => b.id === bemId);
            if (!bem) return;

            // Preencher o formulário de edição
            document.querySelector('#bem-id-edit').value = bem.id;
            document.querySelector('#cliente-nome-edit').value = clientes.find(c => c.id === bem.clienteId)?.nome || '';
            document.querySelector('#tipo-edit').value = bem.tipo;
            document.querySelector('#descricao-edit').value = bem.descricao || '';

            // Atualizar placeholder conforme o tipo
            const descricaoEditField = document.querySelector('#descricao-edit');
            if (bem.tipo && placeholdersPorTipo[bem.tipo]) {
                descricaoEditField.placeholder = placeholdersPorTipo[bem.tipo];
            }

            const modalEditar = document.querySelector('#modal-editar-bem');
            modalEditar.classList.add('open');

            // Fechar modal de edição
            const modalCloseEdit = modalEditar.querySelector('.modal-close');
            modalCloseEdit.addEventListener('click', () => modalEditar.classList.remove('open'));
            modalEditar.addEventListener('click', (e) => {
                if (e.target === modalEditar) modalEditar.classList.remove('open');
            });
        };

        // Salvar alterações do bem
        document.querySelector('#form-editar-bem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const bemId = document.querySelector('#bem-id-edit').value;
            const tipo = document.querySelector('#tipo-edit').value;
            const descricao = document.querySelector('#descricao-edit').value;

            try {
                await atualizarBem(bemId, { tipo, descricao });
                document.querySelector('#msg-editar-bem').textContent = 'Bem atualizado com sucesso!';
                document.querySelector('#msg-editar-bem').className = 'status-message success';

                setTimeout(() => {
                    document.querySelector('#modal-editar-bem').classList.remove('open');
                    carregarBens();
                }, 1500);
            } catch (error) {
                document.querySelector('#msg-editar-bem').textContent = 'Erro ao atualizar bem: ' + error.message;
                document.querySelector('#msg-editar-bem').className = 'status-message error';
            }
        });

        // Listener para mudar placeholder no tipo-edit
        const tipoSelectEdit = document.querySelector('#tipo-edit');
        const descricaoEdit = document.querySelector('#descricao-edit');

        tipoSelectEdit.addEventListener('change', (e) => {
            const tipoSelecionado = e.target.value;
            if (tipoSelecionado && placeholdersPorTipo[tipoSelecionado]) {
                descricaoEdit.placeholder = placeholdersPorTipo[tipoSelecionado];
            } else {
                descricaoEdit.placeholder = 'Ex: Toyota Corolla 2020, branco';
            }
        });

                // Inicializar
                carregarClientes();
                carregarBens();
            } catch (error) {
                console.error('Erro ao inicializar bens:', error);
            }
        });
    </script>
</body>
</html>
